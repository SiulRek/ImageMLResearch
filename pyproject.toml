[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imlresearch"
description = "Image Machine Learning Research Toolkit"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    { name = "SiulRek", email = "luiskraker2000@gmail.com" }
]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
urls = { "Repository" = "https://github.com/SiulRek/ImageMLResearch", "Documentation" = "https://imagemlresearch.readthedocs.io/en/api-development/", "Thesis" = "https://epub.fh-joanneum.at/obvfhjhs/content/titleinfo/11577952" }



dependencies = [
    "tensorflow==2.17.0",
    "pandas==2.2.2",
    "matplotlib==3.8.0",
    "openai==1.34.0",
    "optuna==3.6.1",
    "seaborn==0.13.2",
    "scikit-learn==1.4.1.post1",
    "opencv-python==4.8.1.78"
]

[tool.setuptools.dynamic]
version = {attr = "imlresearch.src.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["./demo", "./local", "demo*", "local*"]

[tool.setuptools.package-data]
"*" = ["*.png", "*.jpg", "*.tfrecord", "*.json"]    # Required for test data

# NOTE: Apply ruff on imlresearch/src
[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # isort
]
ignore = [
    "I001",  # ignore sort of imports,
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["E501", "F401"]  # lines too long; imported but unused

[tool.ruff.lint.isort]
force-single-line = true

[tool.black]
line-length = 79

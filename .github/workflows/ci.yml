name: CI

on:
  push:
    branches: [main, joss-paper]
  pull_request:
    branches: [main, joss-paper]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and CI tools
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff coverage

      - name: Run checks
        run: |
          python <<'PY'
          from pip_build import build_package

          try:
              build_package(check_only=True)
          except Exception:
              raise SystemExit(1)
          else:
              raise SystemExit(0)
          PY
